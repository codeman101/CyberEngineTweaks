name: Build

on:
  pull_request:
  push:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-2022]
        arch: [x64]
        mode: [release]

    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    steps:
    - uses: actions/checkout@v2
    - run: |
        git fetch --prune --unshallow --tags

    - name: Checkout submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --force --recursive --depth=1

    # Force xmake to a specific folder (for cache)
    #- name: Set xmake env
    #  run: echo "XMAKE_GLOBALDIR=$(pwd)/xmake-global" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    # Install xmake
    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: '3.0.8'

    # Update xmake repository (in order to have the file that will be cached)
    - name: Update xmake repository
      run: |
        xmake.exe repo --update
        # Package recipes as of 2026-05-09 (the last green master build); newer recipes pull mimalloc 3.x, which TiltedCore 0.2.7 does not link with.
        $repo = Join-Path $env:LOCALAPPDATA '.xmake\repositories\xmake-repo'
        git -C $repo fetch --depth=1 origin 33a3d2592b35c2e02b01b0824a9f017a787ddec1
        git -C $repo checkout --force FETCH_HEAD
        git -C $repo log -1 --format='xmake-repo %H %cd'

    # Setup compilation mode and install project dependencies
    - name: Configure xmake and install dependencies
      run: xmake.exe config --arch=${{ matrix.arch }} --mode=${{ matrix.mode }} --yes -v

    # Install the result files
    - name: Build and create package
      run: xmake.exe package

    # Upload artifacts
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.mode }}
        path: |
          package/**
          !package/**/*.pdb
    
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.mode }}-pdb
        path: package/**/*.pdb